version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: roboadvisor-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: roboadvisor-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      - qdrant
    restart: unless-stopped

  chatbot:
    build: ./chatbot
    container_name: roboadvisor-chatbot
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=financial-advisor-assistant
      - QDRANT_URL=http://qdrant:6333
      - BACKEND_API_URL=http://backend:8000
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      - qdrant
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: roboadvisor-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_CHATBOT_URL=http://chatbot:8001
      - NEXT_PUBLIC_CHATBOT_WS_URL=ws://chatbot:8001
    depends_on:
      - backend
      - chatbot
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local

networks:
  default:
    name: roboadvisor-network

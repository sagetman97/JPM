services:
  - type: web
    name: portfolio-tools
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: $PORT
      - key: ALLOWED_ORIGINS
        value: https://roboadvisor-mu.vercel.app,http://localhost:3000
      - key: OPENAI_API_KEY
        fromDatabase:
          name: portfolio-tools-db
          key: OPENAI_API_KEY
      - key: SECRET_KEY
        fromDatabase:
          name: portfolio-tools-db
          key: SECRET_KEY
